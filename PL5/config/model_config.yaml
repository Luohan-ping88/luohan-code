stacking:
  base_config:
    n_estimators: 50
    max_depth: 6
    random_state: 42
    n_jobs: 1
    learning_rate: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.8
  meta_config:
    type: logistic
    C: 1.0
    max_iter: 500
    l1_ratio: 0.5
    alpha: 0.0001
    cv_folds: 3
    auto_select: false
    enable_meta_features: false
  model_weights:
    stacking: 0.50
    hmm: 0.10
    copula: 0.10
    bsts: 0.10
    bayesian: 0.10
    evm: 0.05
    mamba: 0.025
    itransformer: 0.025
hmm:
  n_states: 4
  n_mixtures: 2
  auto_select: false
  criterion: bic
  max_states: 6
  min_states: 2
  max_iterations: 30
  convergence_tol: 1e-4
copula:
  type: gaussian
  regularization: 1e-6
  auto_select: false
bsts:
  trend_window: 20
  seasonality_period: null
  outlier_threshold: 2.5
  n_posterior_samples: 500
  confidence_level: 0.95
  candidate_windows:
  - 10
  - 15
  - 20
  retrain_threshold: 0.3
  max_history_length: 300
  learning_rate: 0.05
feature_engineering:
  feature_groups:
    fibonacci:
      enabled: true
      windows:
      - 5
      - 8
    markov:
      enabled: true
      order: 2
    fourier:
      enabled: true
      n_components: 2
    extreme:
      enabled: true
      windows:
      - 10
    pattern:
      enabled: true
      patterns:
      - consecutive
    momentum:
      enabled: true
      windows:
      - 3
      - 5
  cache:
    max_size: 10
  scaler:
    method: standard
    robust_quantile_range:
    - 25.0
    - 75.0
  drift_detection:
    psi_threshold: 0.2
    ks_threshold: 0.05
  selection:
    select_top: 50
    method: rfe
  parallel:
    enable: false
self_learning:
  window: 10
  retrain_threshold: 0.02
  min_history: 3
  volatility_factor: 3.0
  warning_accuracy: 0.12
  urgent_accuracy: 0.08
  max_history_records: 200
  max_suggestion_records: 500
  comprehensive_score_weights:
    accuracy: 0.4
    hit_rate: 0.2
    confidence: 0.2
    stability: 0.2
rl_optimizer:
  state_dim: 64
  action_dim: 4
  actor_lr: 0.001
  critic_lr: 0.005
  gamma: 0.95
  epsilon: 1.0
  epsilon_decay: 0.995
  epsilon_min: 0.01
  batch_size: 32
  memory_capacity: 10000
  n_models: 4
  performance_window: 30
  thompson_sampling:
    initial_alpha: 2.0
    initial_beta: 3.0
    n_arms: 5
prediction:
  top_k: 8
  use_rl: false
  use_uncertainty: false
  parallel_training: false
  prediction_cache_size: 200
training:
  test_size: 0.2
  random_state: 42
  n_splits: 3