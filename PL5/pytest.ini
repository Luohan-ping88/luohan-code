[tool:pytest]
# PL5系统自动化测试配置

# ═══════════════════════════════════════════════════════════════
# 测试发现配置
# ═══════════════════════════════════════════════════════════════
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ═══════════════════════════════════════════════════════════════
# 测试执行配置
# ═══════════════════════════════════════════════════════════════
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --durations=10
    --color=yes

# ═══════════════════════════════════════════════════════════════
# 标记定义
# ═══════════════════════════════════════════════════════════════
markers =
    # 测试类型标记
    unit: 单元测试（快速，测试单个组件）
    integration: 集成测试（测试模块间协作）
    e2e: 端到端测试（测试完整业务流程）
    performance: 性能测试（测试系统性能）
    
    # 功能模块标记
    data: 数据相关测试
    model: 模型相关测试
    validation: 验证测试
    
    # 执行速度标记
    slow: 慢速测试（需要较长时间，>10秒）
    fast: 快速测试（<1秒）

# ═══════════════════════════════════════════════════════════════
# 过滤警告
# ═══════════════════════════════════════════════════════════════
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning

# ═══════════════════════════════════════════════════════════════
# 日志配置
# ═══════════════════════════════════════════════════════════════
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# 文件日志
log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ═══════════════════════════════════════════════════════════════
# 覆盖率配置（需要安装pytest-cov）
# ═══════════════════════════════════════════════════════════════
# 取消注释以下行以启用覆盖率报告
# addopts = 
#     -v
#     --tb=short
#     --strict-markers
#     --disable-warnings
#     --cov=src
#     --cov-report=term-missing
#     --cov-report=html:tests/coverage_html
#     --cov-report=xml:tests/coverage.xml
#     --cov-fail-under=80

# ═══════════════════════════════════════════════════════════════
# 测试顺序和并行配置
# ═══════════════════════════════════════════════════════════════
# 使用pytest-xdist进行并行测试
# addopts = -n auto

# ═══════════════════════════════════════════════════════════════
# 自定义选项
# ═══════════════════════════════════════════════════════════════
[pytest]
minversion = 7.0
